# Server Port
server.port=8085
spring.application.name=solar-microgenerator-approval

# Camunda 8 Zeebe Broker (Local c8run / Camunda 8 Self-Managed)
zeebe.client.broker.gateway-address=127.0.0.1:26500
zeebe.client.security.plaintext=true

# Camunda Auto Deployment
camunda.auto-deploy.bpmn-resources=classpath*:models/*.bpmn
camunda.auto-deploy.dmn-resources=classpath*:models/*.dmn

# Logging
logging.level.com.camunda.solar=INFO
logging.level.io.camunda.zeebe.client=INFO
logging.level.org.springframework.web=INFO
